name: Secret demo
on: workflow_dispatch
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secret
        env:
          MY_API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          if [ -n "$MY_API_KEY" ]; then echo "Secret is set, length ${#MY_API_KEY}"; else echo "Secret is missing"; fi
          echo "Trying to print it: $MY_API_KEY"
